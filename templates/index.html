<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.H.A.R.L.E.S. - Autonomous Operational System</title>
  <meta name="theme-color" content="#020912">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f3ff;
      --primary-glow: rgba(0, 243, 255, 0.45);
      --accent: #ff3344;
      --bg: #030a16;
      --panel: rgba(4, 18, 36, 0.75);
      --border: rgba(0, 243, 255, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #07192f 0%, var(--bg) 100%);
      color: #e5f3ff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 0.8rem;
    }

    header {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--primary);
      text-shadow: 0 0 12px var(--primary-glow);
    }

    .telemetry-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #7caad9;
    }

    .badge-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    .install-pwa-btn {
      display: none;
      background: rgba(0, 243, 255, 0.2);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 12px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .install-pwa-btn:hover {
      background: var(--primary);
      color: #030a16;
      box-shadow: 0 0 10px var(--primary);
    }

    /* Arc Reactor */
    .reactor-container {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed var(--primary);
      animation: rotateRing 22s linear infinite;
      box-shadow: 0 0 25px var(--primary-glow), inset 0 0 25px var(--primary-glow);
    }

    .ring-inner {
      position: absolute;
      width: 75%;
      height: 75%;
      border-radius: 50%;
      border: 1px solid var(--primary);
      animation: rotateRingRev 14s linear infinite;
    }

    .reactor-core {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f3ff 20%, #034260 70%, #021124 100%);
      box-shadow: 0 0 40px var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .reactor-core:active {
      transform: scale(0.92);
    }

    .reactor-core svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
      filter: drop-shadow(0 0 6px #000);
    }

    .listening-mode .reactor-core {
      background: radial-gradient(circle, #ff3344 20%, #750e18 70%, #200408 100%);
      box-shadow: 0 0 50px var(--accent);
      animation: pulseAlert 1.1s ease-in-out infinite;
    }

    .listening-mode .ring-outer {
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(255, 51, 68, 0.6);
    }

    /* Controls Banner */
    .controls-banner {
      width: 100%;
      max-width: 650px;
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      margin-bottom: 0.6rem;
      gap: 10px;
      flex-wrap: wrap;
    }

    .model-selector-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-selector-box label {
      font-size: 0.8rem;
      color: #79a8d7;
      text-transform: uppercase;
      font-weight: 700;
    }

    .model-dropdown {
      background: rgba(2, 17, 36, 0.95);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    .toggle-btn {
      background: rgba(0, 243, 255, 0.2);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 12px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: #030a16;
      box-shadow: 0 0 10px var(--primary);
    }

    /* Terminal HUD */
    .hud-display {
      width: 100%;
      max-width: 650px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      min-height: 180px;
      max-height: 280px;
      overflow-y: auto;
      backdrop-filter: blur(12px);
      box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.06);
      margin-bottom: 0.8rem;
    }

    .hud-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6da2d8;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
    }

    .chat-msg {
      margin-bottom: 0.8rem;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .chat-msg.user {
      color: #8ed0ff;
    }

    .chat-msg.charles {
      color: #ffffff;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.15);
    }

    .chat-msg strong {
      font-family: 'Orbitron', monospace;
      color: var(--primary);
      font-size: 0.88rem;
      letter-spacing: 1px;
    }

    .actions-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 0.5rem;
    }

    .action-btn {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--primary);
      color: #030a16;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    /* Controls Bar */
    .controls {
      width: 100%;
      max-width: 650px;
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .input-text {
      flex: 1;
      background: rgba(3, 18, 38, 0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
    }

    .input-text:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .send-btn {
      background: var(--primary);
      color: #030a16;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px var(--accent); }
      50% { transform: scale(1.08); box-shadow: 0 0 60px var(--accent); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">C.H.A.R.L.E.S.</div>
    <div class="telemetry-bar">
      <button class="install-pwa-btn" id="installBtn">📲 Instalar App</button>
      <div class="badge-item">
        <span>⚡</span>
        <span id="batteryTag">100%</span>
      </div>
      <div class="badge-item">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">ONLINE</span>
      </div>
    </div>
  </header>

  <div class="reactor-container" id="reactorBox">
    <div class="ring-outer"></div>
    <div class="ring-inner"></div>
    <div class="reactor-core" id="micBtn" title="Toque para falar ou diga 'Charles'">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
  </div>

  <div class="controls-banner">
    <div class="model-selector-box">
      <label for="modelSelect">Cérebro:</label>
      <select id="modelSelect" class="model-dropdown">
        <option value="llama-3.1-8b-instant" selected>Llama 3.1 8B (Ultra Rápido)</option>
        <option value="llama-3.1-70b-versatile">Llama 3.1 70B (Versátil)</option>
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
        <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
      </select>
    </div>
    <button class="toggle-btn" id="wakeToggle">ESCUTA: "CHARLES"</button>
  </div>

  <div class="hud-display" id="hud">
    <div class="hud-title">
      <span>Diagnóstico Operacional</span>
      <span id="latencyTag">SISTEMA ATIVO</span>
    </div>
    <div class="chat-msg charles">
      <strong>CHARLES:</strong> À sua inteira disposição, senhor. Todos os subsistemas estão calibrados. Como posso assisti-lo hoje?
    </div>
  </div>

  <div class="controls">
    <input type="text" id="textInput" class="input-text" placeholder="Instrua o Charles..." autocomplete="off">
    <button id="sendBtn" class="send-btn">EXECUTAR</button>
  </div>

  <audio id="audioPlayer" playsinline></audio>

  <script>
    const micBtn = document.getElementById('micBtn');
    const reactorBox = document.getElementById('reactorBox');
    const hud = document.getElementById('hud');
    const statusText = document.getElementById('statusText');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const audioPlayer = document.getElementById('audioPlayer');
    const wakeToggle = document.getElementById('wakeToggle');
    const batteryTag = document.getElementById('batteryTag');
    const modelSelect = document.getElementById('modelSelect');
    const installBtn = document.getElementById('installBtn');

    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let conversationHistory = [];
    let isWakeWordActive = false;
    let speechRecognizer = null;
    let deviceTelemetry = { battery: '100%', connection: 'Online' };
    let audioCtx = null;
    let deferredPrompt = null;

    // 1. Suporte a Instalação Nativa PWA (Captura o prompt de download)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // 2. AudioContext seguro
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSciFiChime(type = 'activate') {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'activate') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        } else {
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.15);
        }

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start();
        osc.stop(ctx.currentTime + 0.16);
      } catch (e) {}
    }

    // 3. Busca modelos compatíveis com Tool Calling
    async function fetchAvailableModels() {
      try {
        const res = await fetch('/api/models');
        if (res.ok) {
          const data = await res.json();
          if (data.models && data.models.length > 0) {
            modelSelect.innerHTML = '';
            data.models.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m;
              opt.innerText = m;
              if (m === 'llama-3.1-8b-instant') opt.selected = true;
              modelSelect.appendChild(opt);
            });
          }
        }
      } catch (e) {
        console.log("Usando modelos padrão de fallback.");
      }
    }
    fetchAvailableModels();

    // 4. Telemetria de Bateria
    if ('getBattery' in navigator) {
      navigator.getBattery().then(batt => {
        function updateBattery() {
          const level = Math.round(batt.level * 100);
          batteryTag.innerText = `${level}%${batt.charging ? ' ⚡' : ''}`;
          deviceTelemetry.battery = `${level}% (${batt.charging ? 'Carregando' : 'Descarregando'})`;
        }
        updateBattery();
        batt.addEventListener('levelchange', updateBattery);
        batt.addEventListener('chargingchange', updateBattery);
      });
    }

    async function startRecording() {
      if (isRecording) return;
      try {
        playSciFiChime('activate');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = sendVoiceData;
        mediaRecorder.start();
        isRecording = true;
        reactorBox.classList.add('listening-mode');
        statusText.innerText = "ESCUTANDO...";
      } catch (err) {
        alert("Permissão de microfone negada: " + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        playSciFiChime('deactivate');
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        reactorBox.classList.remove('listening-mode');
        statusText.innerText = "PROCESSANDO...";
      }
    }

    function toggleRecording() {
      if (!isRecording) startRecording();
      else stopRecording();
    }

    async function sendVoiceData() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'voice.webm');
      formData.append('history', JSON.stringify(conversationHistory));
      formData.append('telemetry', JSON.stringify(deviceTelemetry));
      formData.append('model', modelSelect.value);

      const startTime = performance.now();

      try {
        const response = await fetch('/api/interact-voice', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        const duration = Math.round(performance.now() - startTime);

        if (response.ok) {
          appendMessage('USER', data.transcription);
          appendMessage('CHARLES', data.response_text, data.mobile_actions);
          playAudio(data.audio_base64);
          document.getElementById('latencyTag').innerText = `LATÊNCIA: ${duration}ms (${modelSelect.value})`;
        } else {
          appendMessage('CHARLES', 'Peço desculpas, senhor: ' + (data.error || 'Erro operacional.'));
        }
      } catch (e) {
        appendMessage('CHARLES', 'Falha no link de comunicação: ' + e.message);
      } finally {
        statusText.innerText = "ONLINE";
      }
    }

    async function sendTextMessage() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';

      appendMessage('USER', text);
      statusText.innerText = "PROCESSANDO...";
      const startTime = performance.now();

      try {
        const response = await fetch('/api/interact-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            history: conversationHistory,
            telemetry: deviceTelemetry,
            model: modelSelect.value
          })
        });

        const data = await response.json();
        const duration = Math.round(performance.now() - startTime);

        if (response.ok) {
          appendMessage('CHARLES', data.response_text, data.mobile_actions);
          playAudio(data.audio_base64);
          document.getElementById('latencyTag').innerText = `LATÊNCIA: ${duration}ms (${modelSelect.value})`;
        } else {
          appendMessage('CHARLES', 'Erro de sistema: ' + data.error);
        }
      } catch (e) {
        appendMessage('CHARLES', 'Erro de conexão: ' + e.message);
      } finally {
        statusText.innerText = "ONLINE";
      }
    }

    function appendMessage(sender, text, actions = []) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg ${sender.toLowerCase()}`;
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;

      if (actions && actions.length > 0) {
        const actionBox = document.createElement('div');
        actionBox.className = 'actions-container';
        actions.forEach(act => {
          const btn = document.createElement('a');
          btn.className = 'action-btn';
          btn.href = act.url;
          btn.target = '_blank';
          btn.rel = 'noopener noreferrer';
          btn.innerHTML = `⚡ ${act.description}`;
          actionBox.appendChild(btn);
        });
        msgDiv.appendChild(actionBox);
      }

      hud.appendChild(msgDiv);
      hud.scrollTop = hud.scrollHeight;

      conversationHistory.push({ role: sender === 'USER' ? 'user' : 'assistant', content: text });
      if (conversationHistory.length > 12) conversationHistory.shift();
    }

    function playAudio(base64Audio) {
      if (!base64Audio) return;
      audioPlayer.src = "data:audio/mp3;base64," + base64Audio;
      audioPlayer.play().catch(e => console.log("Áudio bloqueado:", e));
    }

    // 5. Wake-word
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      speechRecognizer = new SpeechRecognition();
      speechRecognizer.continuous = true;
      speechRecognizer.interimResults = false;
      speechRecognizer.lang = 'pt-BR';

      speechRecognizer.onresult = (event) => {
        const lastResult = event.results[event.results.length - 1][0].transcript.toLowerCase();
        if (lastResult.includes('charles') && !isRecording) {
          startRecording();
          setTimeout(() => {
            if (isRecording) stopRecording();
          }, 6000);
        }
      };

      speechRecognizer.onend = () => {
        if (isWakeWordActive) speechRecognizer.start();
      };
    }

    wakeToggle.addEventListener('click', () => {
      if (!speechRecognizer) {
        alert("Reconhecimento contínuo não suportado neste navegador. Use o botão do Reator Arc.");
        return;
      }
      isWakeWordActive = !isWakeWordActive;
      if (isWakeWordActive) {
        wakeToggle.classList.add('active');
        wakeToggle.innerText = 'ESCUTA ATIVA';
        speechRecognizer.start();
      } else {
        wakeToggle.classList.remove('active');
        wakeToggle.innerText = 'ESCUTA: "CHARLES"';
        speechRecognizer.stop();
      }
    });

    micBtn.addEventListener('click', toggleRecording);
    sendBtn.addEventListener('click', sendTextMessage);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendTextMessage();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW falhou:', err));
      });
    }
  </script>
</body>
</html>
